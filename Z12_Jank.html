<html>
 <body>
 <div style="color:green;font-size:32px;">
 <script language="JavaScript">

var D1_metu = prompt("Podaj Dzien nr 1 (D1):", "");
var G1_metu = prompt("Podaj godzinę w tym dniu (G1):", "");
var D2_metu = prompt("Podaj Dzien nr 2 (D2):", "");
var G2_metu = prompt("Podaj godzinę w tym dniu (G2):", "");

var d1 = parseFloat(D1_metu);
var g1 = parseFloat(G1_metu);
var d2 = parseFloat(D2_metu);
var g2 = parseFloat(G2_metu);


var t1 = (d1 - 1) * 24 * 3600 + g1 * 3600;
var t2 = (d2 - 1) * 24 * 3600 + g2 * 3600;

var sekund = t1 - t2;

document.write("Ilość sekund między D1="+d1+" G1="+g1+" a D2="+d2+" G2="+g2+" = " + sekund + " sekund<br>");

function okno_zamknij_metu()
{
  window.close()
}
 </script>
 </div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_metu()"/>
 </body>
</html>
