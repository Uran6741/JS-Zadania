<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 20 - długości boków trójkąta</title>
    <style>
        button{
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Długości boków trójkąta</h1>
    <p>Podaj współrzędne trzech punktów niewspółliniowych:</p>

    <fieldset>
        <legend>Punkt A</legend>
        <label for="xa_jan">x<sub>A</sub>:</label>
        <input type="number" id="xa_jan" step="any">
        <label for="ya_jan">y<sub>A</sub>:</label>
        <input type="number" id="ya_jan" step="any">
    </fieldset>

    <fieldset>
        <legend>Punkt B</legend>
        <label for="xb_jan">x<sub>B</sub>:</label>
        <input type="number" id="xb_jan" step="any">
        <label for="yb_jan">y<sub>B</sub>:</label>
        <input type="number" id="yb_jan" step="any">
    </fieldset>

    <fieldset>
        <legend>Punkt C</legend>
        <label for="xc_jan">x<sub>C</sub>:</label>
        <input type="number" id="xc_jan" step="any">
        <label for="yc_jan">y<sub>C</sub>:</label>
        <input type="number" id="yc_jan" step="any">
    </fieldset>

    <button type="button" onclick="oblicz()">Oblicz długości boków</button>
    <button type="button" onclick="zamknijOkno()">zamknij okno</button>
    <p id="wynik" aria-live="polite"></p>

    <script>
        function zamknijOkno() {
            window.close();
        }

        function AB_jan(xa_jan, ya_jan, xb_jan, yb_jan) {
            return Math.hypot(xb_jan - xa_jan, yb_jan - ya_jan);
        }

        function BC_jan(xb_jan, yb_jan, xc_jan, yc_jan) {
            return Math.hypot(xc_jan - xb_jan, yc_jan - yb_jan);
        }

        function AC_jan(xa_jan, ya_jan, xc_jan, yc_jan) {
            return Math.hypot(xc_jan - xa_jan, yc_jan - ya_jan);
        }

        function oblicz() {
            var xa_jan = document.getElementById("xa_jan").valueAsNumber;
            var ya_jan = document.getElementById("ya_jan").valueAsNumber;
            var xb_jan = document.getElementById("xb_jan").valueAsNumber;
            var yb_jan = document.getElementById("yb_jan").valueAsNumber;
            var xc_jan = document.getElementById("xc_jan").valueAsNumber;
            var yc_jan = document.getElementById("yc_jan").valueAsNumber;
            var wynik = document.getElementById("wynik");
            var wspolrzedne = [xa_jan, ya_jan, xb_jan, yb_jan, xc_jan, yc_jan];

            if (!wspolrzedne.every(Number.isFinite)) {
                wynik.textContent = "Wpisz poprawne współrzędne wszystkich trzech punktów.";
                return;
            }

            var polePodwojne = (xb_jan - xa_jan) * (yc_jan - ya_jan)
                - (yb_jan - ya_jan) * (xc_jan - xa_jan);

            if (polePodwojne === 0) {
                wynik.textContent = "Te punkty są współliniowe i nie tworzą trójkąta.";
                return;
            }

            var ab = AB_jan(xa_jan, ya_jan, xb_jan, yb_jan);
            var bc = BC_jan(xb_jan, yb_jan, xc_jan, yc_jan);
            var ac = AC_jan(xa_jan, ya_jan, xc_jan, yc_jan);

            wynik.textContent = "AB = " + ab.toFixed(2)
                + ", BC = " + bc.toFixed(2)
                + ", AC = " + ac.toFixed(2);
        }
    </script>
</body>
</html>
        </textarea>
        <input type="button" value="zamknij okno" onclick="okno_zamknij_Jankowski()" />
    </body>
</html>
